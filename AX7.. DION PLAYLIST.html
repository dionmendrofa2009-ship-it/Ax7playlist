<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WAKING THE FALLEN</title>

<meta property="og:title" content="Waking The Fallen">
<meta property="og:description" content="A7X Dark Playlist">
<meta property="og:type" content="website">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Metal+Mania&family=Oswald:wght@700&display=swap">
<style>
:root{
  --ink:#0a0a0a;
  --paper:#141414;
  --accent:#c1121f;
  --accent2:#8b0000;
  --steel:#9ea3ab;
  --bg:#050505;
  --text:#d8d8d8;
  color-scheme:dark;
}
body.theme-purple { --accent:#8a2be2; --accent2:#4b0082; }
body.theme-green { --accent:#39ff14; --accent2:#006400; --text:#e0e0e0;}
body.theme-blood { --accent:#ff0000; --accent2:#8b0000; }

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background-color:var(--bg);
  background-image:
    radial-gradient(circle at 50% 0%, rgba(193,18,31,.15), transparent 60%),
    repeating-linear-gradient(0deg, transparent 0 2px, rgba(255,255,255,.02) 2px 3px);
  color:var(--text);
  font-family:'Oswald',system-ui,sans-serif;
  font-weight:700;line-height:1.5;
  cursor: crosshair;
  transition: background .5s, color .5s;
}

.cursor-dot { position: fixed; top: 0; left: 0; width: 12px; height: 12px; background: var(--accent); border-radius: 50%; pointer-events: none; z-index: 9999; box-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent); transform: translate(-50%, -50%); transition: width .2s, height .2s; }
.cursor-ring { position: fixed; top: 0; left: 0; width: 40px; height: 40px; border: 1px solid var(--accent); border-radius: 50%; pointer-events: none; z-index: 9998; transform: translate(-50%, -50%); transition: transform .1s ease-out; }

button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

#embers,#bats-canvas{position:fixed;inset:0;z-index:1;width:100%;height:100%;pointer-events:none}

.hanging-bats-container { position: fixed; top: 0; left: 0; width: 100%; height: 100px; z-index: 3; pointer-events: none; }
.hanging-bat { position: absolute; top: 0; font-size: 2.5rem; color: var(--ink); transform-origin: top center; animation: swing 4s ease-in-out infinite alternate; pointer-events: auto; cursor: pointer; text-shadow: 0 0 5px rgba(193,18,31,0.5); transition: transform 0.2s, color 0.2s; }
.hanging-bat:hover { color: var(--accent); transform: scale(1.2); }
.hanging-bat.fall { animation: fall 1s forwards cubic-bezier(0.5, 0, 1, 1); }
@keyframes swing { 0% { transform: rotate(-10deg); } 100% { transform: rotate(10deg); } }
@keyframes fall { 0% { transform: rotate(0) translateY(0); } 100% { transform: rotate(180deg) translateY(300px); opacity: 0; } }

#deck{position:relative;z-index:2;display:flex;height:100vh;height:100dvh;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
#deck::-webkit-scrollbar{display:none}
.panel{position:relative;flex:0 0 100vw;width:100vw;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;display:flex;padding:24px 20px 96px;scrollbar-width:none}
.panel::-webkit-scrollbar{display:none}
.inner{width:min(1100px,100%);margin:auto;opacity:0;transform:translateX(60px) scale(.96);transition:opacity .5s ease,transform .6s cubic-bezier(.34,1.56,.64,1)}
.panel.active .inner{opacity:1;transform:none}

h1,h2{font-family:'Metal Mania',Impact,sans-serif;font-weight:400;margin:0}
h2{font-size:clamp(2rem,6vw,3rem);letter-spacing:.06em;text-align:center;margin-bottom:22px;color:var(--accent);text-shadow:0 0 8px rgba(193,18,31,.6),0 0 20px rgba(193,18,31,.3)}

.glitch { position: relative; animation: glitch-skew 1s infinite linear alternate-reverse paused; }
.playing-audio .glitch { animation-play-state: running; }
.glitch::before, .glitch::after { content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); }
.glitch::before { left: 2px; text-shadow: -2px 0 red; clip: rect(44px, 450px, 56px, 0); animation: glitch-anim 5s infinite linear alternate-reverse; opacity: 0.8;}
.glitch::after { left: -2px; text-shadow: -2px 0 blue; clip: rect(44px, 450px, 56px, 0); animation: glitch-anim2 5s infinite linear alternate-reverse; opacity: 0.8;}
@keyframes glitch-anim { 0% { clip: rect(10px, 9999px, 83px, 0); } 20% { clip: rect(62px, 9999px, 14px, 0); } 40% { clip: rect(33px, 9999px, 99px, 0); } 60% { clip: rect(88px, 9999px, 44px, 0); } 80% { clip: rect(5px, 9999px, 62px, 0); } 100% { clip: rect(55px, 9999px, 33px, 0); } }
@keyframes glitch-anim2 { 0% { clip: rect(65px, 9999px, 100px, 0); } 20% { clip: rect(12px, 9999px, 55px, 0); } 40% { clip: rect(90px, 9999px, 22px, 0); } 60% { clip: rect(33px, 9999px, 88px, 0); } 80% { clip: rect(77px, 9999px, 11px, 0); } 100% { clip: rect(22px, 9999px, 66px, 0); } }
@keyframes glitch-skew { 0% { transform: skew(0deg); } 20% { transform: skew(-2deg); } 40% { transform: skew(2deg); } 60% { transform: skew(-1deg); } 80% { transform: skew(1deg); } 100% { transform: skew(0deg); } }

#hero .inner{text-align:center;position:relative}
.burst{position:absolute;top:50%;left:50%;width:min(120vw,820px);aspect-ratio:1;border-radius:50%;background:conic-gradient(from 0deg, transparent, rgba(193,18,31,.2), transparent, rgba(193,18,31,.2), transparent);-webkit-mask:radial-gradient(circle,#000 20%,transparent 65%);mask:radial-gradient(circle,#000 20%,transparent 65%);animation:rot 40s linear infinite;pointer-events:none;filter:blur(2px)}
@keyframes rot{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}

.tag{position:relative;display:inline-block;background:var(--accent2);color:#fff;border:2px solid var(--accent);padding:4px 18px;letter-spacing:.2em;font-size:.8rem;text-transform:uppercase;margin-bottom:18px;box-shadow:0 0 14px rgba(193,18,31,.5)}
#hero h1{position:relative;font-size:clamp(2.6rem,10vw,6rem);line-height:1;letter-spacing:.06em;color:var(--text);text-shadow:0 0 10px var(--accent),0 0 30px rgba(193,18,31,.5),0 0 60px rgba(193,18,31,.2); z-index: 10;}

.dion-fav { font-family: 'Creepster', 'Sanggar', cursive; font-size: clamp(1.2rem, 4vw, 2rem); color: var(--accent); text-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent2); margin: 10px 0 20px; letter-spacing: .1em; transform: rotate(-2deg); }

.cap{position:relative;display:inline-block;margin:26px 0 26px;background:rgba(20,20,20,.8);border:1px solid var(--accent2);padding:8px 20px;font-size:clamp(.9rem,3vw,1.1rem);color:var(--steel);letter-spacing:.1em;text-transform:uppercase}
.btn{position:relative;display:inline-flex;align-items:center;padding:13px 32px;background:var(--accent);color:#fff;border:2px solid var(--accent);font-weight:700;letter-spacing:.15em;text-transform:uppercase;font-size:.9rem;transition:background .2s,box-shadow .2s}
.btn:hover{background:var(--accent2);box-shadow:0 0 20px rgba(193,18,31,.7)}
.btn:active{transform:translateY(2px)}
.ghost{background:transparent;border:1px solid var(--steel);color:var(--steel);padding:9px 18px;font-size:.8rem;box-shadow:none}
.ghost:hover{background:rgba(158,163,171,.1);color:#fff}
.ghost[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-bat{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:9px 18px;font-size:.8rem;box-shadow:0 0 10px rgba(193,18,31,.2)}
.btn-bat:hover{background:var(--accent);color:#fff;box-shadow:0 0 20px rgba(193,18,31,.6)}

.player{display:grid;grid-template-columns:210px 1fr;gap:34px;align-items:center;background:var(--paper);border:1px solid var(--accent2);padding:30px;box-shadow:0 0 30px rgba(193,18,31,.15),inset 0 0 40px rgba(0,0,0,.5); position: relative; z-index: 5;}
.art{position:relative;width:210px;aspect-ratio:1;border-radius:50%;border:3px solid var(--accent2);box-shadow:0 0 24px rgba(193,18,31,.4);background:radial-gradient(circle,var(--accent) 0 12%,var(--ink) 13% 16%,transparent 17%),repeating-radial-gradient(circle,#0a0a0a 0 3px,#1a1a1a 3px 6px);animation:spin 9s linear infinite paused}
.art::after{content:"🦇";position:absolute;inset:0;display:grid;place-items:center;color:var(--accent);font-size:2.4rem;text-shadow:0 0 10px var(--accent)}
.art.on{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.now small{color:var(--steel);letter-spacing:.15em;text-transform:uppercase;font-size:.75rem}
.now h3{font-family:'Metal Mania',Impact,sans-serif;font-size:2.2rem;letter-spacing:.04em;line-height:1.1;margin:2px 0 4px;overflow-wrap:anywhere;color:#fff;text-shadow:0 0 10px rgba(193,18,31,.4)}
#status{min-height:1.5em;font-size:.88rem;color:var(--steel)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--accent2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
.bar{display:flex;align-items:center;gap:12px;margin:14px 0}
.bar time{font-size:.82rem;min-width:42px;font-variant-numeric:tabular-nums;color:var(--steel)}
input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border:1px solid var(--accent2);background:linear-gradient(90deg,var(--accent) var(--p,0%),#1a1a1a var(--p,0%));flex:1;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 10px var(--accent)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 10px var(--accent)}
.ctl{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:10px;}
.ic{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:transparent;border:1px solid var(--steel);color:var(--steel);transition:all .2s}
.ic:hover{color:#fff;border-color:var(--accent);box-shadow:0 0 14px rgba(193,18,31,.5)}
.ic:disabled{opacity:.3;cursor:default;box-shadow:none}
.ic svg{width:20px;height:20px;fill:currentColor}
.ic.act{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 14px rgba(193,18,31,.6)}
.ic.main{width:66px;height:66px;background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 22px rgba(193,18,31,.7)}
.ic.main:hover{background:var(--accent2)}
.ic.main svg{width:28px;height:28px}
.rn{position:absolute;font-size:.6rem;font-weight:800;top:4px;right:8px}
.vol{display:flex;align-items:center;gap:10px;max-width:280px;margin:16px auto 0}

.visualizer-container { margin-top: 20px; height: 40px; display: flex; align-items: flex-end; gap: 3px; justify-content: center; }
.v-bar { width: 6px; background: var(--accent); border-radius: 2px 2px 0 0; height: 5%; transition: height 0.1s; box-shadow: 0 0 8px var(--accent); }

.tools{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:5px;padding:12px 8px 8px 12px;border:1px solid #2a2a2a;background:var(--paper);transition:all .2s; position: relative; z-index: 5;}
.row:hover{border-color:var(--accent);box-shadow:0 0 16px rgba(193,18,31,.25);transform:translateY(-2px)}
.row.cur{background:linear-gradient(135deg,#1a0000,#2a0000);border-color:var(--accent);box-shadow:0 0 18px rgba(193,18,31,.4)}
.row.bad{opacity:.5}
.tt{grid-column:1/-1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:6px;display:flex;align-items:center;gap:8px}
.tt .tx{overflow:hidden;text-overflow:ellipsis;font-size:.9rem;letter-spacing:.03em}
.no{flex:none;display:grid;place-items:center;width:28px;height:28px;background:transparent;border:1px solid var(--accent2);color:var(--accent);font-family:'Metal Mania',sans-serif;font-size:.9rem}
.tt em{font-style:normal;font-size:.7rem;display:block;color:var(--accent)}
.row .ic{width:34px;height:34px}
.row .ic:first-of-type{grid-column:2}
.eq{display:none;flex:none;gap:2px;align-items:flex-end;height:14px}
.row.cur.playing .eq{display:inline-flex}
.eq i{width:3px;background:var(--accent);animation:eq .8s ease-in-out infinite;box-shadow:0 0 6px var(--accent)}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
.fav svg{fill:none;stroke:currentColor;stroke-width:2.2}
.fav.on{background:var(--accent);border-color:var(--accent);color:#fff}
.fav.on svg{fill:currentColor}
.empty{grid-column:1/-1;text-align:center;padding:20px;color:var(--steel)}

.msg{position:relative;max-width:720px;margin:0 auto 34px;text-align:center;padding:44px 34px;border:1px solid var(--accent2);background:linear-gradient(160deg,#0d0d0d,#1a0000);box-shadow:0 0 40px rgba(193,18,31,.2)}
.msg::before{content:"🦇";display:block;font-size:2rem;color:var(--accent);margin-bottom:12px;text-shadow:0 0 14px var(--accent)}
.msg p{font-size:clamp(1rem,3vw,1.3rem);line-height:1.8;margin:0;color:var(--text);letter-spacing:.04em}

#nav{position:fixed;z-index:10;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:5px 8px;border:1px solid var(--accent2);background:rgba(10,10,10,.92);backdrop-filter:blur(6px);box-shadow:0 0 20px rgba(193,18,31,.3)}
#nav .dot{padding:7px 14px;font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);border:1px solid transparent;transition:all .2s}
#nav .dot:hover{color:#fff}
#nav .dot.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#nav .ic{width:34px;height:34px;border:none}
#nav .ic:hover{background:rgba(193,18,31,.2)}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);max-width:min(92vw,460px);background:#0d0d0d;border:1px solid var(--accent);box-shadow:0 0 20px rgba(193,18,31,.5);padding:12px 18px;font-size:.88rem;opacity:0;pointer-events:none;transition:.3s;z-index:50;text-align:center;color:var(--text)}
#toast.show{opacity:1;transform:translate(-50%,0)}

#blood-overlay { position: fixed; inset: 0; background: rgba(255, 0, 0, 0.2); pointer-events: none; z-index: 9999; opacity: 0; transition: opacity 2s; }
#blood-overlay.active { opacity: 1; }

@media(max-width:1000px){ol{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){
  .panel{padding:18px 14px 92px}
  .player{grid-template-columns:1fr;padding:20px;gap:14px;text-align:center}
  .art{width:112px}
  .now h3{font-size:1.7rem}
  ol{grid-template-columns:repeat(2,1fr);gap:12px}
  #nav .dot{padding:6px 8px;font-size:.68rem}
  .msg{padding:32px 22px}
  .hanging-bat { font-size: 1.8rem; }
}
@media(max-width:380px){#nav .dot{padding:6px 5px;font-size:.6rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.inner{opacity:1;transform:none}}
</style>
</head>
<body class="theme-blood">

<div class="cursor-ring" id="cursorRing"></div>
<div id="blood-overlay"></div>

<canvas id="embers" aria-hidden="true"></canvas>
<canvas id="bats-canvas" aria-hidden="true"></canvas>

<div class="hanging-bats-container" id="hangingBats"></div>

<div id="deck">
  <section class="panel" id="hero">
    <div class="inner">
      <div class="burst" aria-hidden="true"></div>
      <span class="tag">A7X · DARK MIX</span>

            <button class="ic" id="next" aria-label="Lagu berikutnya"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
            <button class="ic" id="rep" aria-label="Repeat: mati" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg><span class="rn" id="rn"></span></button>
          </div>
          <div class="vol"><button class="ic" id="mute" aria-label="Mute"><svg viewBox="0 0 24 24" id="vi"></svg></button><input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume"></div>
          
          <div style="margin-top:20px; text-align:center; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
            <button class="btn-bat" id="summonBats">🦇 Summon Bats 🦇</button>
            <button class="btn-bat" id="changeTheme" style="border-color:var(--steel); color:var(--steel)">🎨 Ganti Tema</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="panel" id="listPanel">
    <div class="inner">
      <h2>The Setlist</h2>
      <div class="tools">
        <button class="btn ghost" id="playAll">Play All</button>
        <button class="btn ghost" id="pauseAll">Pause</button>
        <button class="btn ghost" id="favOnly" aria-pressed="false">Favorit</button>
        <button class="btn ghost" id="addFile">Tambah Audio</button>
        <input type="file" id="fileIn" accept="audio/*" multiple hidden>
      </div>
      <ol id="rows"></ol>
    </div>
  </section>

  <section class="panel" id="msgPanel">
    <div class="inner">
      <div class="msg"><p>“This is war. No mercy. No surrender. Turn it up until the walls shake and the neighbors call the cops.”</p></div>
    </div>
  </section>
</div>
